<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    #image-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    #image-container img {
      width: 100%;
      height: auto;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    #overlay-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: bold;
      color: red;
      z-index: 10;
    }
  </style>
</head>
<body>
  <h1>Type a College Name</h1>
  <input type="text" id="college-input" placeholder="Enter college name">
  <button onclick="startSearch()">Press Enter</button>

  <div id="image-container">
    <div id="overlay-text">You're not getting in</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
